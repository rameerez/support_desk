es:
  support_desk:
    # The system message the requester sees when a human picks up their case.
    system:
      assigned: "%{agent} se ocupa de tu consulta"
      reassigned: "%{agent} se ocupa ahora de tu consulta"
    thread:
      closed_notice: "Esta conversación está cerrada. Abre una nueva si necesitas algo más."
      reopened_notice: "Hemos vuelto a abrir esta conversación."
      promise: "Normalmente respondemos en menos de %{time}"
    notifications:
      # Generic on purpose: una pantalla de bloqueo no debe contar de qué va
      # el caso de nadie. El detalle va en el cuerpo.
      title: "%{desk} · nuevo mensaje"
    queue:
      tabs:
        awaiting: "Pendientes"
        mine: "Mi cola"
        unassigned: "Sin asignar"
        open: "Abiertos"
        snoozed: "Pospuestos"
        closed: "Cerrados"
    summary:
      awaiting_reply: "esperando respuesta"
      awaiting_requester: "esperando al cliente"
      open: "abierto"
      closed: "cerrado"
    status:
      open: "Abierto"
      snoozed: "Pospuesto"
      closed: "Cerrado"
    channels:
      in_app: "en la app"
      email: "correo"
      intercom: "Intercom"
      api: "API"
    # The requester's own list of cases.
    tickets:
      title: "Soporte"
      empty_title: "Todavía no has escrito a soporte"
      empty_hint: "Cuando abras una conversación la verás aquí."
      closed_section:
        one: "1 conversación cerrada"
        other: "%{count} conversaciones cerradas"
      state:
        awaiting_reply: "Estamos con ello"
        answered: "Te hemos contestado"
        closed: "Cerrada"
    # The ways in, from anywhere in the host app.
    doors:
      new: "¿Necesitas ayuda?"
      about: "¿Necesitas ayuda con %{subject}?"
      existing: "Ver tu conversación de soporte"
      new_conversation: "Abrir una nueva conversación"
    inbox:
      empty_hint: "¿Necesitas ayuda? Escríbenos"
    limits:
      title: "Ya tienes conversaciones abiertas"
      too_many_open_title: "Ya tienes conversaciones abiertas"
      too_fast_title: "Vas muy rápido"
      your_message: "Lo que has escrito, para que puedas copiarlo:"
      too_many_open:
        one: "Ya tienes una conversación abierta. Escríbenos ahí y seguimos en la misma."
        other: "Ya tienes %{count} conversaciones abiertas. Escríbenos en una de ellas y seguimos ahí."
      too_fast: "Has abierto varias conversaciones en muy poco tiempo. Espera un momento o escríbenos en una de las que ya tienes."
    wizard:
      ask_topic: "¿Con qué necesitas ayuda?"
      ask_subject: "¿Sobre cuál?"
      write: "Cuéntanos qué ha pasado"
      placeholder: "Cuéntanos qué ha pasado"
      none_of_these: "Ninguno de estos"
      already_open: "Ya tienes una conversación abierta"
      back: "Atrás"
      back_to_list: "Ver tus conversaciones"
      send: "Enviar"
      sending: "Enviando"
      write_anyway: "Escríbenos de todos modos"
      message_required: "Escríbenos unas líneas para que podamos ayudarte."
      nothing_to_pick: "No encontramos nada sobre lo que abrir esta conversación."
      no_topics: "Ahora mismo no se pueden abrir conversaciones nuevas."
    topics:
      other:
        label: "Otra cosa"
        ask: "¿De qué se trata?"
